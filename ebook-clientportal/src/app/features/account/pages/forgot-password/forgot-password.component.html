<!-- ========================= Breadcrumb Start =============================== -->
<app-breadcrumb title = "Forgot Password"></app-breadcrumb>
<!-- ========================= Breadcrumb End =============================== -->


<!-- =============================== Account Section Start =========================== -->
<section class="account py-80">
    <div class="container container-lg">

            <div class="row gy-4">

                <!-- Login Card Start -->
                <div class="col-xl-4 pe-xl-2"></div>
                <div class="col-xl-4 pe-xl-5 border border-gray-100 hover-border-main-600 transition-1 rounded-16 px-24 py-40">
                   <form  #form="ngForm" (ngSubmit)="sendRequest(form)">

                      <div class="mb-24">
                         <label class="text-neutral-900 text-lg mb-8 fw-medium">
                          Email address <span class="text-danger">*</span>
                        </label>
                        <input type="email"
                              name="email"
                              [(ngModel)]="forgotPasswordData.email"
                              required
                              placeholder="Enter Email Address"
                              class="common-input">
                      </div>
                      <button type="submit" class="btn btn-main py-18 w-100 rounded-8">
                            Reset Password
                      </button>
                       <!-- Back to Login -->
                        <div class="col-xl-12 pe-xl-3">
                          <div class="mt-12">
                            <a [routerLink]="['/signin']"
                              class="text-gray-600 text-sm fw-semibold hover-text-decoration-underline">
                            <i class="ph ph-arrow-bend-up-left"></i> Back to Sign-In
                            </a>
                          </div>
                        </div>
                    </form>

                </div>
                 <div class="col-xl-4 pe-xl-2"></div>
                <!-- Login Card End -->
            </div>
    </div>
</section>
<!-- =============================== Account Section End =========================== -->
