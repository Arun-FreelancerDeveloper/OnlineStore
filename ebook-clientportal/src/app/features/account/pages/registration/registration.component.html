<!-- ========================= Breadcrumb Start =============================== -->
<app-breadcrumb title="Sign-Up"></app-breadcrumb>
<!-- ========================= Breadcrumb End =============================== -->

<!-- =============================== Account Section Start =========================== -->
<section class="account py-80">
  <div class="container container-lg">
    <div class="row gy-4">

      <div class="col-xl-4 pe-xl-2"></div>

      <div class="col-xl-4 pe-xl-5 border border-gray-100 hover-border-main-600 transition-1 rounded-16 px-24 py-40">

        <!-- ✅ FORM START -->
        <form #form="ngForm" (ngSubmit)="register(form)">

          <!-- Full Name -->
          <div class="mb-24">
            <label class="text-neutral-900 text-lg mb-8 fw-medium">
              Full Name <span class="text-danger">*</span>
            </label>
            <input type="text"
                   name="fullname"
                   [(ngModel)]="registerData.fullname"
                   required
                   placeholder="Write your full name"
                   class="common-input">
          </div>

          <!-- Email -->
          <div class="mb-24">
            <label class="text-neutral-900 text-lg mb-8 fw-medium">
              Email address <span class="text-danger">*</span>
            </label>
            <input type="email"
                   name="email"
                   [(ngModel)]="registerData.email"
                   required
                   placeholder="Enter Email Address"
                   class="common-input">
          </div>

          <!-- Password -->
          <div class="mb-24">
            <label class="text-neutral-900 text-lg mb-8 fw-medium">
              Password <span class="text-danger">*</span>
            </label>
            <div class="position-relative">
              <input type="password"
                     name="password"
                     [(ngModel)]="registerData.password"
                     required
                     placeholder="Enter Password"
                     class="common-input">

              <!-- optional eye icon -->
              <span class="toggle-password position-absolute top-50 inset-inline-end-0 me-16 translate-middle-y cursor-pointer ph ph-eye-slash"></span>
            </div>
          </div>

          <!-- Info -->
          <div class="my-48">
            <p class="text-gray-500">
              Your personal data will be used to process your order, support your experience throughout this website, and for other purposes described in our
              <a [routerLink]="['/privacy']" class="text-main-600 text-decoration-underline">
                privacy policy
              </a>.
            </p>
          </div>

          <!-- Submit Button -->
          <button type="submit"
                  [disabled]="isLoading"
                  class="btn btn-main py-18 w-100 rounded-8">

            <span *ngIf="!isLoading">Create</span>
            <span *ngIf="isLoading">Processing...</span>

          </button>

          <!-- Back to Login -->
          <div class="col-xl-12 pe-xl-3">
            <div class="mt-12">
              <a [routerLink]="['/signin']"
                 class="text-gray-600 text-sm fw-semibold hover-text-decoration-underline">
               <i class="ph ph-arrow-bend-up-left"></i> Back to Sign-In
              </a>
            </div>
          </div>

        </form>
        <!-- ✅ FORM END -->
      </div>
      <div class="col-xl-4 pe-xl-2"></div>
    </div>
  </div>
</section>
<!-- =============================== Account Section End =========================== -->
