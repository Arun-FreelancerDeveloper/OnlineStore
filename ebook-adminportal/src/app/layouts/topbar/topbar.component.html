<div class="topbar d-print-none">
  <div class="container-fluid">
    <nav
      class="topbar-custom d-flex justify-content-between"
      [class.nav-sticky]="scrollY > 50"
      id="topbar-custom"
    >
      <ul
        class="topbar-item list-unstyled d-inline-flex align-items-center mb-0"
      >
        <li>
          <button
            (click)="toggleMobileMenu()"
            class="nav-link mobile-menu-btn nav-icon"
            id="togglemenu"
          >
            <i class="iconoir-menu-scale"></i>
          </button>
        </li>
        <li class="mx-3 welcome-text">
          
        </li>
      </ul>
      <ul
        class="topbar-item list-unstyled d-inline-flex align-items-center mb-0"
      >
        <li class="hide-phone app-search">
         
        </li>
        <li class="dropdown" ngbDropdown>
         
        </li>
        <!--end topbar-language-->

        <li class="topbar-item">
          <a
            class="nav-link nav-icon"
            (click)="changeTheme()"
            href="javascript:void(0);"
            id="light-dark-mode"
          >
            <i class="icofont-sun dark-mode"></i>
            <i class="icofont-moon light-mode"></i>
          </a>
        </li>

        <li class="dropdown topbar-item" ngbDropdown>
          
        </li>

        <li class="dropdown topbar-item" ngbDropdown placement="bottom-end">
          <a
            class="nav-link dropdown-toggle arrow-none nav-icon"
            ngbDropdownToggle
            data-bs-toggle="dropdown"
            href="javascript:void(0);"
            role="button"
            aria-haspopup="false"
            aria-expanded="false"
          >
            <img
              src="assets/images/users/avatar-1.jpg"
              alt=""
              class="thumb-lg rounded-circle"
            />
          </a>
          <div class="dropdown-menu dropdown-menu-end py-0" ngbDropdownMenu>
            <div
              class="d-flex align-items-center dropdown-item py-2 bg-secondary-subtle"
            >
              <div class="flex-shrink-0">
                <img
                  src="assets/images/users/avatar-1.jpg"
                  alt=""
                  class="thumb-md rounded-circle"
                />
              </div>
              <div class="flex-grow-1 ms-2 text-truncate align-self-center">
                <h6 class="my-0 fw-medium text-dark fs-13">Hi Admin</h6>
              </div>
              <!--end media-body-->
            </div>
            <a class="dropdown-item text-danger" routerLink="/auth/log-in"
              ><i class="las la-power-off fs-18 me-1 align-text-bottom"></i>
              Logout</a
            >
          </div>
        </li>
      </ul>
      <!--end topbar-nav-->
    </nav>
    <!-- end navbar-->
  </div>
</div>
