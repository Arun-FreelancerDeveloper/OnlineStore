<div class="row justify-content-center">

  <div class="col-md-12 col-lg-12">
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center">
          <div class="col">
            <h4 class="card-title">Product Group</h4>
          </div>
          <div class="col text-end">
            <a routerLink="/productgroup/add" class="btn btn-primary btn-md">
              <i class="las la-plus me-2"></i>Add New Group
            </a>
          </div>
          <!--end col-->
        </div>
        <!--end row-->
      </div>
      <!--end card-header-->
      <div class="card-body pt-0">
        <div class="row">
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label" for="groupSearch">Search</label>
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  id="groupSearch"
                  placeholder="Ex : Find Product"
                  [(ngModel)]="searchText"
                >
                <button type="button" class="btn btn-primary" (click)="searchGroups()">
                  Search
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered mb-0 table-centered">
            <thead>
              <tr>
                <th>S.No</th>
                <th>Group Name</th>
                <th class="text-end"></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of lstProductGroup; let i = index">
                <td>{{ data.sno }}</td>
                <td>{{ data.groupname }}</td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-primary me-2"
                    (click)="editGroup(data.groupid)"
                  >
                    <i class="las la-edit"></i>
                  </button>

                  <button
                    class="btn btn-sm btn-danger"
                    (click)="deleteGroup(data.groupid)"
                  >
                    <i class="las la-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
          <!--end /table-->
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-3 gap-2" *ngIf="totalPages > 0">
          <div class="text-muted">
            Page {{ currentPage }} of {{ totalPages }} • Total Records: {{ totalRecords }}
          </div>

          <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <button class="page-link" type="button" (click)="goToPage(currentPage - 1)">Previous</button>
              </li>

              <li class="page-item" *ngFor="let page of getPageNumbers()" [class.active]="page === currentPage">
                <button class="page-link" type="button" (click)="goToPage(page)">{{ page }}</button>
              </li>

              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <button class="page-link" type="button" (click)="goToPage(currentPage + 1)">Next</button>
              </li>
            </ul>
          </nav>
        </div>
        <!--end /tableresponsive-->
      </div>
      <!--end card-body-->
    </div>
    <!--end card-->
  </div>
  <!--end col-->
</div>
<!--end row-->
